# Cabecalhos de seguranca da Central (copia do vercel.json). Incluido em CADA
# location que usa add_header: no nginx, add_header dentro de um location
# SUBSTITUI os do server, entao nao da para declarar uma vez so no server.
# Instalar em /etc/nginx/snippets/central-seguranca.conf
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

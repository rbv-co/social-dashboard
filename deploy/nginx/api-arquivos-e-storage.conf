# Trecho do nginx da API (o vhost que faz proxy para a API Go) para o Storage em disco e as rotas públicas da Vessel.
# Plano 6: NOTAS-DA-IMPLANTACAO.md, "nginx da API". Incluir DENTRO do server { } da API, antes do `location /` genérico.

# O IP do cliente: a API só confia em X-Real-IP quando a conexão vem de rede privada (o nginx). Sem esta linha todo
# anônimo vira o mesmo IP e o limite por IP derruba a loja inteira. Vale para o server inteiro:
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $remote_addr;   # o Core manda o dele (a API só o lê com a chave do Core)

# Arquivos: um vídeo do Conteúdo tem até 300 MiB. Sem buffer do corpo: o arquivo vai direto à API, que corta no teto do bucket.
location /arquivos/ {
    client_max_body_size 320m;
    proxy_request_buffering off;
    proxy_read_timeout 700s;
    proxy_send_timeout 700s;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Dialeto do Supabase: URL pública e assinada (download), upload de currículo (≤ 5 MiB, ainda pelo mesmo teto).
location /storage/ {
    client_max_body_size 320m;
    proxy_request_buffering off;
    proxy_read_timeout 700s;
    proxy_send_timeout 700s;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Rotas públicas da Vessel (Core e site): corpo pequeno (a API corta em 32 KiB) e resposta rápida.
location ~ ^/(rest/v1/rpc|functions/v1)/ {
    client_max_body_size 64k;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

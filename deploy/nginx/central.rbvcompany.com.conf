# central.rbvcompany.com + socialdashboard.rbvcompany.com: a Central (Vite/Vue
# estatico) servida pelo nginx do host. Sai da Vercel; Supabase continua.
# Raiz: /var/www/central/atual -> releases/<sha> (trocado por deploy/publicar-central.sh).
#
# ORDEM (um ssl_certificate inexistente derruba o nginx e TODOS os dominios):
#   1. certificado ja emitido: certbot certonly --manual --preferred-challenges dns
#        -d central.rbvcompany.com -d socialdashboard.rbvcompany.com
#      (2 TXT _acme-challenge no GoDaddy; depois do corte de DNS:
#       certbot reconfigure --cert-name central.rbvcompany.com --authenticator nginx --installer nginx)
#   2. copiar este arquivo e central-seguranca.conf (para /etc/nginx/snippets/)
#   3. ln -s em sites-enabled/ && nginx -t && systemctl reload nginx
#
# Comportamento copiado do vercel.json: SPA com fallback para index.html (menos
# /escritorio-3d, que e pasta estatica), /verify/* (307) para o vessel-brasil, cabecalhos.
# index.html/sw-push.js/manifest SEM cache: o aviso de "versao nova" compara o
# hash de /assets/index-*.js do index do servidor com o da pagina aberta.

server {
    listen 80;
    server_name central.rbvcompany.com socialdashboard.rbvcompany.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name central.rbvcompany.com socialdashboard.rbvcompany.com;

    ssl_certificate /etc/letsencrypt/live/central.rbvcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/central.rbvcompany.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/central/atual;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    access_log /var/log/nginx/central.access.log;
    error_log  /var/log/nginx/central.error.log;

    include /etc/nginx/snippets/central-seguranca.conf;

    # Mesmo redirect do vercel.json (temporario, como la).
    location ~ ^/verify/(.+)$ {
        include /etc/nginx/snippets/central-seguranca.conf;
        return 307 https://vesselbrasil.com.br/verify/$1;
    }

    # Pacotes com hash no nome: imutaveis. Arquivo que nao existe = 404 de verdade
    # (cair no index.html daria HTML no lugar de JS).
    location /assets/ {
        include /etc/nginx/snippets/central-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pasta estatica, fora do fallback da SPA.
    location /escritorio-3d/ {
        include /etc/nginx/snippets/central-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
    location = /escritorio-3d { return 301 /escritorio-3d/; }

    location = /sw-push.js {
        include /etc/nginx/snippets/central-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/central-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/central-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

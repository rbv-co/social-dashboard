# API em Go da Central na MESMA origem do front (/api/...). Aplicado SÓ no corte (MIGRACAO-GO/ROTEIRO-DA-VIRADA.md):
#   install -m 644 nginx-central-api.conf /etc/nginx/snippets/central-api.conf
#   e, DENTRO do `server { listen 443 ... }` de central.rbvcompany.com: include /etc/nginx/snippets/central-api.conf;
# Regras (docs/migracao-go/NOTAS-DA-IMPLANTACAO.md, Planos 3 e 6): as rotas Go NÃO têm o prefixo /api; só o
# catch-all usa "proxy_pass .../;" (troca /api/ por /); cada location própria nomeia o caminho de destino (a barra
# sozinha mandaria "/" ao upstream). X-Real-IP vem do par TCP (o cliente não forja).
# Nenhuma location aqui declara proxy_set_header (senão teria de repetir os dois abaixo).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;

location /api/ {
    client_max_body_size 1m;
    proxy_read_timeout 40s;
    proxy_pass http://127.0.0.1:8080/;
}
# As duas rotas do Chatwoot (/api/receber-webhook-chatwoot e /api/receber-opt-out-chatwoot) NÃO ficam aqui: o
# ops/virada/spool-nginx.sh edge|spool|go gera /etc/nginx/snippets/central-chatwoot.conf (repetir = duplicate location).
# Instalar este arquivo SÓ com o central-chatwoot.conf já no ar: sem ele, as duas caem no /api/ acima, cujo access_log
# herdado (central.access.log, combined) grava o ?token=.
location = /api/receber-webhook-pedido-shopify { client_max_body_size 5m; proxy_pass http://127.0.0.1:8080/receber-webhook-pedido-shopify; }
location = /api/receber-webhook-checkout       { client_max_body_size 5m; proxy_pass http://127.0.0.1:8080/receber-webhook-checkout; }
location = /api/receber-webhook-abandono       { client_max_body_size 5m; proxy_pass http://127.0.0.1:8080/receber-webhook-abandono; }
# prazos da API: contar-collabs 120 s; bling-proxy, insights-ao-vivo, serie-novos-dia e custo-* 90 s; meta-proxy até 75 s
location = /api/contar-collabs   { client_max_body_size 64k; proxy_read_timeout 130s; proxy_pass http://127.0.0.1:8080/contar-collabs; }
location = /api/bling-proxy      { client_max_body_size 64k; proxy_read_timeout 100s; proxy_pass http://127.0.0.1:8080/bling-proxy; }
location = /api/meta-proxy       { client_max_body_size 64k; proxy_read_timeout 100s; proxy_pass http://127.0.0.1:8080/meta-proxy; }
location = /api/insights-ao-vivo { client_max_body_size 64k; proxy_read_timeout 100s; proxy_pass http://127.0.0.1:8080/insights-ao-vivo; }
location = /api/serie-novos-dia  { client_max_body_size 64k; proxy_read_timeout 100s; proxy_pass http://127.0.0.1:8080/serie-novos-dia; }
location = /api/custo-anthropic  { client_max_body_size 1k;  proxy_read_timeout 100s; proxy_pass http://127.0.0.1:8080/custo-anthropic; }
location = /api/custo-openai     { client_max_body_size 1k;  proxy_read_timeout 100s; proxy_pass http://127.0.0.1:8080/custo-openai; }
# arquivos (vídeo do Conteúdo até 300 MiB; a API estende o prazo da conexão a 10 min)
location /api/arquivos/ {
    client_max_body_size 320m; proxy_request_buffering off; proxy_read_timeout 700s; proxy_send_timeout 700s;
    proxy_pass http://127.0.0.1:8080/arquivos/;
}
location /api/storage/ {
    client_max_body_size 320m; proxy_request_buffering off; proxy_read_timeout 700s; proxy_send_timeout 700s;
    proxy_pass http://127.0.0.1:8080/storage/;
}

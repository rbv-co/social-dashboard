# Nível http (/etc/nginx/conf.d/semquery.conf): formato SEM query string para as locations do webhook do Chatwoot,
# cujo segredo viaja em ?token= (ops/vps/api/nginx-central-api.conf). Não pode ter $args, $query_string,
# $arg_token, $request_uri nem $request.
log_format semquery '$remote_addr [$time_local] "$request_method $uri" $status';

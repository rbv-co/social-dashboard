name: Cópia de segurança do banco

# ⚠️ RETAGUARDA MANUAL, SÓ ATÉ O CORTE DA SAÍDA DO SUPABASE.
#
# A cópia de TODO DIA roda na VPS: coletor/vps/robos.cron (06h12 UTC, 03h12 em Campinas) chama
# coletor/vps/copia-do-banco.sh, que roda o MESMO guardar-copia-do-banco.mjs (domingo com --semanal, dia 1º
# confere a cópia de ontem). Este workflow só existe para disparo manual enquanto o banco é o Supabase.
#
# ⚠️ POR QUE ELE PARA NO CORTE
# Depois do corte o banco é o Postgres da API (contêiner api-db na VPS), que NÃO publica porta: um runner do
# GitHub não chega nele, e abrir porta pública num banco para um backup é trocar um risco por outro. A cópia
# da VPS passa a ler o Postgres novo (COPIA_DB_SENHA em /etc/robos.env; ops/vps/api-db/LEIA-ME.md). Se este
# workflow rodasse depois do corte, copiaria o Supabase VELHO e, como o upload sobrescreve pelo nome
# (override-name-exist), trocaria a cópia boa do dia por dado parado. Por isso, no corte, o dono liga a
# variável do repositório SAIU_DO_SUPABASE=sim (gh variable set SAIU_DO_SUPABASE --body sim) e a primeira
# etapa abaixo recusa com QUALQUER valor não vazio (0, false, no também recusam: a trava não pode falhar aberta).
# Também no corte: apagar (ou renomear) o segredo SUPABASE_SERVICE_KEY do repositório, que derruba até os
# disparos manuais de branches antigas, que levam a versão velha deste arquivo sem a trava. O Plano 8 apaga este
# arquivo junto com os segredos do Supabase.
#
# O minuto 12 da VPS evita a hora cheia e a madrugada evita disputar banda com os robôs do dia. DOMINGO leva
# `--semanal`: inclui o histórico de métrica, que é grande e quase todo recoletável.
on:
  # AGENDAMENTO NA VPS (coletor/vps/robos.cron): este workflow só roda por disparo manual, como retaguarda.
  workflow_dispatch:
    inputs:
      semanal:
        description: 'Incluir o histórico de métrica? (sim/não)'
        required: false
        default: ''
      ensaio:
        description: 'Só ensaiar, sem enviar nada? (sim/não)'
        required: false
        default: ''

concurrency:
  group: copia-do-banco
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Recusar depois do corte
        if: vars.SAIU_DO_SUPABASE != ''
        run: |
          echo "::error::Saímos do Supabase: a cópia roda só na VPS (coletor/vps/robos.cron) e lê o Postgres da API. Este workflow copiaria dado velho por cima da cópia boa do dia."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Guardar a cópia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEMANAL: ${{ github.event.inputs.semanal }}
          ENSAIO: ${{ github.event.inputs.ensaio }}
        run: |
          argumentos=""
          # Domingo é 0 em `date +%w`. Também aceita o pedido manual.
          if [ "$(date -u +%w)" = "0" ] || [ -n "$SEMANAL" ]; then
            argumentos="$argumentos --semanal"
          fi
          if [ -n "$ENSAIO" ]; then
            argumentos="$argumentos --ensaio"
          else
            # A limpeza do que passou do prazo só na rodada automática, e ela
            # tem teto de 5 pastas por vez: se um dia a conta da data sair
            # errada, ela leva cinco, não o acervo inteiro.
            argumentos="$argumentos --limpar"
          fi
          node coletor/guardar-copia-do-banco.mjs $argumentos

      - name: Conferir a cópia de ontem, dia 1º de cada mês
        # ⚠️ BACKUP QUE NUNCA FOI RESTAURADO NÃO É BACKUP, É UM ARQUIVO.
        # Uma vez por mês o robô baixa a cópia do dia anterior e confere cada
        # arquivo contra o manifesto — contagem de linhas e soma de verificação.
        if: github.event.inputs.ensaio == ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            ontem=$(date -u -d 'yesterday' +%Y-%m-%d)
            node coletor/restaurar-copia.mjs --conferir "$ontem"
          else
            echo "não é dia 1º — a conferência mensal roda no dia 1º."
          fi

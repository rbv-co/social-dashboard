name: Relatórios Comerciais

# Diário 08:52 UTC (05:52 Brasília): re-agrega o mês corrente.
#
# Minuto quebrado de propósito: agendamento na hora cheia (ou na meia) cai no pico
# de carga do GitHub Actions e atrasa. Medido neste repo: pedimos 08:40 e as
# rodadas saíram entre 10:22 e 11:41 — 2 a 3h de atraso.
# Disparo manual com input `backfill` (Nº de meses) p/ popular o histórico.
on:
  # AGENDAMENTO NA VPS (coletor/vps/robos.cron): este workflow só roda por disparo manual, como retaguarda.
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Nº de meses p/ backfill (vazio = só o mês corrente)'
        required: false
        default: ''

concurrency:
  group: relatorios-comerciais
  cancel-in-progress: false

jobs:
  agregar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Rodar job de relatórios comerciais
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          if [ -n "$BACKFILL" ] && ! printf '%s' "$BACKFILL" | grep -qE '^[0-9]+$'; then
            echo "backfill inválido (esperado número): $BACKFILL"; exit 1
          fi
          node coletor/relatorios-comerciais.mjs --backfill="$BACKFILL"

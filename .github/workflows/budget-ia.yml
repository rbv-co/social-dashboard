name: Budget IA (análise diária)

# Todo dia 09:41 UTC (06:41 Brasília) + disparo manual.
# Minuto quebrado e fora da hora cheia de propósito: agendamento na hora cheia
# entra na fila do Actions e atrasa 2-3h (já medido neste repo).
#
# O escopo muda conforme o dia (decidido dentro do robô, no fuso de Brasília):
#   - todo dia: só as campanhas em veiculação agora;
#   - segunda:  também as que veicularam em algum momento nos últimos 7 dias.
on:
  schedule:
    # 08:00 BRT. O cron do GitHub Actions é em UTC, e o Brasil não tem mais
    # horário de verão, então BRT = UTC-3 o ano todo.
    #
    # Rodava 06:41 BRT; passou pra 08:00 a pedido do dono (2026-07-29), junto do
    # aviso de saldo — assim, quando ele abre o painel de manhã, a fila já está
    # com a análise do dia e não com a de ontem.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      escopo:
        description: 'Escopo da rodada (auto = decide pelo dia da semana)'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'ativas', 'amplo']

concurrency:
  group: budget-ia
  cancel-in-progress: false

jobs:
  analise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Rodar análise de budget
        env:
          ANTHROPIC_API_KEY_TRAFEGO: ${{ secrets.ANTHROPIC_API_KEY_TRAFEGO }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUDGET_ESCOPO: ${{ inputs.escopo }}
          # Graph da Meta pelo core (desligado por padrão: variável do repositório CORE_META ausente).
          # Ligado, este passo NÃO lê accounts.access_token da Meta.
          CORE_META: ${{ vars.CORE_META }}
          CORE_URL: ${{ vars.CORE_URL }}
          CORE_API_TOKEN: ${{ secrets.CORE_API_TOKEN }}
        run: node coletor/budget-ia.mjs

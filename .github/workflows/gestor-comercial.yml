name: Gestor Comercial (briefing semanal)

# Segunda 09:23 UTC (06:23 Brasília) + disparo manual. (16min após o coletor de notícias.)
#
# Minuto quebrado de propósito: agendamento na hora cheia (ou na meia) cai no pico
# de carga do GitHub Actions e atrasa muito. Medido neste repo: pedimos 09:10 e a
# rodada de 13/07 só começou às 12:15 — 3h05 de atraso. O atraso não some (o
# agendamento do Actions nunca é pontual), mas encolhe fora do pico.
on:
  # AGENDAMENTO NA VPS (coletor/vps/robos.cron): este workflow só roda por disparo manual, como retaguarda.
  workflow_dispatch: {}

concurrency:
  group: gestor-comercial
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Rodar gestor comercial
        env:
          ANTHROPIC_API_KEY_GESTOR: ${{ secrets.ANTHROPIC_API_KEY_GESTOR }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: node coletor/gestor-comercial.mjs

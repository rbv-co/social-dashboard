name: Sugestão de interesses (semanal)

# Domingo 10:34 UTC (07:34 Brasília) + disparo manual.
#
# SEMANAL, não diária: a sugestão é por marca × objetivo (hoje 6 gerações no
# total) e não muda de um dia pro outro. Rodar todo dia só multiplicaria o custo
# sem mudar o resultado.
#
# DOMINGO de propósito: assim a sugestão está fresca quando a semana começa e o
# dono vai montar campanha.
#
# MINUTO QUEBRADO e fora da hora cheia: agendamento na hora cheia entra na fila
# do Actions e atrasa 2-3h (já medido neste repo — ver budget-ia.yml). Também
# escolhido pra não colidir com os outros robôs, que se concentram nas manhãs de
# segunda e nos primeiros minutos das 9h UTC.
on:
  # AGENDAMENTO NA VPS (coletor/vps/robos.cron): este workflow só roda por disparo manual, como retaguarda.
  # Horário: domingo 10:34 UTC (07:34 BRT; o Brasil não tem mais horário de verão).
  workflow_dispatch:
    inputs:
      modo:
        description: 'seco = roda tudo e não grava (a IA custa igual) · sonda = só pergunta à Meta o que existe, sem IA, R$ 0'
        required: false
        default: 'normal'
        type: choice
        options: ['normal', 'seco', 'sonda', 'sonda-posicionamentos']

concurrency:
  group: sugerir-interesses
  cancel-in-progress: false

jobs:
  sugerir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # SEGURANÇA: os passos abaixo têm comando FIXO e são escolhidos por `if`.
      # Nada vindo de fora entra na linha de comando — nem a escolha do modo.
      # Segredo só por `env:`, nunca interpolado no `run:`.
      #
      # ESTA CONDIÇÃO LISTA QUEM PODE GASTAR, e não quem não pode. Já foi
      # `inputs.modo != 'seco'`, escrita quando só existiam dois modos. Quando o
      # modo `sonda` nasceu (2026-07-31), ela silenciosamente passou a significar
      # "sonda também é pra valer": o dispatch da sonda rodou o robô DE VERDADE
      # antes dela e gravou em produção. Custou uma rodada de IA e sujou a tabela
      # com a versão anterior à etapa de escolha.
      #
      # Escrita assim, um modo novo criado amanhã falha pro lado seguro: não roda
      # nada até alguém decidir conscientemente que ele pode gastar.
      #
      # AS DUAS PRIMEIRAS CLÁUSULAS COBREM O AGENDAMENTO: no evento `schedule`
      # não existe `inputs`, então `inputs.modo` vem nulo. Em tese `null == ''`
      # é verdadeiro nas expressões do Actions (os dois viram 0 na conversão),
      # mas essa é exatamente a classe de "segundo a documentação" que este
      # projeto já pagou caro pra não confiar. E aqui o preço de errar é o robô
      # semanal parar de rodar SEM NADA FICAR VERMELHO — passo pulado é verde.
      # Duas cláusulas custam nada; descobrir isso em três domingos custa caro.
      - name: Rodar sugestão de interesses
        if: ${{ inputs.modo == null || inputs.modo == '' || inputs.modo == 'normal' }}
        env:
          # Lida pelo lib-llm.mjs (structured()).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Leitura e gravação no Supabase (REST).
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Login da conta de serviço: o meta-proxy exige SESSÃO DE USUÁRIO, não
          # a service key — ele chama auth.getUser() e devolve 401 sem usuário.
          # Sem estes dois, o robô roda, toma 401 em toda busca de interesse e
          # grava zero sugestões pra sempre, sem nada parecer erro.
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: node coletor/sugerir-interesses.mjs

      - name: Rodar em seco (sem gravar)
        if: ${{ inputs.modo == 'seco' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: node coletor/sugerir-interesses.mjs --dry

      # SONDA: pergunta à Meta o que EXISTE no catálogo, sem passar por IA.
      # Diagnóstico puro — não grava nada e não decide nada.
      #
      # REPARE NA FALTA DA ANTHROPIC_API_KEY: não é esquecimento. A sonda não
      # chama modelo nenhum, então a chave não é entregue a este passo. Se um dia
      # alguém precisar dela aqui, é sinal de que a sonda deixou de ser sonda.
      - name: Sondar o catálogo da Meta (sem IA, R$ 0)
        if: ${{ inputs.modo == 'sonda' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: node coletor/sondar-interesses.mjs

      # Segunda sonda, mesma natureza: pergunta ao Graph o que os conjuntos REAIS
      # têm de posicionamento hoje, antes de escrever tela pra editar isso.
      # Também sem IA, também sem a chave da Anthropic.
      - name: Sondar posicionamentos dos conjuntos (sem IA, R$ 0)
        if: ${{ inputs.modo == 'sonda-posicionamentos' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: node coletor/sondar-posicionamentos.mjs


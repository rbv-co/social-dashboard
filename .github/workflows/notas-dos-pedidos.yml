name: Notas dos Pedidos (data da venda)

# DE HORA EM HORA (aos 23 minutos): descobre em que dia cada venda foi FATURADA
# e guarda na tabela bling_pedido_nota.
#
# Por que de hora em hora e não uma vez por dia: a Gestão à Vista é um TELÃO que
# mostra "hoje". Uma nota emitida hoje de manhã, de um pedido de ontem, só
# entraria no dia certo na rodada seguinte — com rodada diária, isso é amanhã.
# De hora em hora, o telão fica no máximo uma hora atrás. A rodada é barata:
# a janela de 7 dias leva cerca de 1 minuto e o robô é idempotente.
#
# Por que 7 dias de janela e não 1: o pedido não é concluído no dia em que é
# feito. Medido em 11/08/2026, o pedido nº2372 era de 27/07 e só virou Atendido
# em 11/08 — uma janela de 1 dia o perderia para sempre. O robô é idempotente
# (upsert por pedido), então reler o mesmo pedido sete vezes não custa nada.
#
# O minuto 23 evita a hora cheia (medido neste repo: agendar na hora cheia
# atrasa de 2 a 3 horas) e não colide com o
# Relatórios Comerciais (08:52 UTC) — os dois batem no mesmo Bling, que limita
# 3 chamadas por segundo.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dias:
        description: 'Janela em dias (vazio = 7)'
        required: false
        default: ''
      backfill:
        description: 'Nº de MESES de histórico (vazio = não faz backfill)'
        required: false
        default: ''

concurrency:
  group: notas-dos-pedidos
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Rodar o robô das notas
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
          DIAS: ${{ github.event.inputs.dias }}
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          for var in DIAS BACKFILL; do
            valor="${!var}"
            if [ -n "$valor" ] && ! printf '%s' "$valor" | grep -qE '^[0-9]+$'; then
              echo "$var inválido (esperado número): $valor"; exit 1
            fi
          done
          if [ -n "$BACKFILL" ]; then
            node coletor/notas-dos-pedidos.mjs --backfill="$BACKFILL"
          else
            node coletor/notas-dos-pedidos.mjs --dias="${DIAS:-7}"
          fi

name: Fábrica de Anúncios (Estúdio)
on:
  workflow_dispatch:
    inputs:
      job_id: { description: 'fabrica_jobs.id', required: true }
concurrency: { group: fabrica-estudio, cancel-in-progress: false }
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # actions:write -> o runner pode disparar o próximo LOTE via GITHUB_TOKEN (workflow_dispatch é
    # permitido pra o token automático), encadeando a geração em lotes até o fim.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Cache BiRefNet + deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.u2net
            coletor/node_modules
            ~/.cache/pip
          key: fabrica-${{ runner.os }}-${{ hashFiles('coletor/package-lock.json') }}
      - name: Instalar deps
        run: |
          cd coletor && npm ci
          # onnxruntime PINADO por reprodutibilidade (sem pin o pip flutua de versão
          # e a máscara do BiRefNet muda em silêncio). NOTA: o furo do corpo creme
          # (bolsa clara sobre fundo branco) NÃO é a versão — persiste no 1.19.2 no
          # runner Linux (é limpo no macOS local); é diferença de plataforma da
          # inferência. Fix do recorte em aberto (ver recortar.py).
          pip install rembg "onnxruntime==1.19.2" pillow numpy
          # ffmpeg p/ o MP4 (motion) do widescreen 16:9 — pré-instalado no ubuntu-latest, guard por garantia
          which ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Rodar job
        env:
          FABRICA_JOB_ID: ${{ github.event.inputs.job_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # VIRADA (plano 04): com os dois abaixo as tabelas fabrica_* vão pela API Go (token srv_ do usuário
          # robo-fabrica, lib/fabrica-banco.mjs); sem eles o robô segue no Supabase (rollback). Storage, gc_* e o
          # login Supabase seguem lá (fase 2). Depois da virada, a variável FABRICA_EXIGE_API=1 (Settings → Variables)
          # faz o job FALHAR em vez de gravar calado no banco congelado se o token faltar.
          CENTRAL_API_URL: ${{ secrets.CENTRAL_API_URL }}
          CENTRAL_API_TOKEN: ${{ secrets.CENTRAL_API_TOKEN }}
          FABRICA_EXIGE_API: ${{ vars.FABRICA_EXIGE_API }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TRAFEGO }}
          # loginServico() (usado por gerar/subir/ativar) autentica como usuário de serviço —
          # precisa do email/senha do gestor, senão dá "missing email or phone" (400).
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
          # Motor Hero-IA (opt-in via params.heroIa): gpt-image-2 (OpenAI) gera o hero fotorreal
          # com medalhão/placa fiel. Sem este secret, hero-ia é pulado (não quebra o job).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # encadeamento automático dos lotes (o runner dispara o próximo lote via workflow_dispatch)
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          # Zoho WorkDrive: export dos finais pra nuvem (por loja -> data) quando a campanha fica pronta.
          # Sem estes secrets, o export é pulado (não quebra o job).
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_DC: ${{ secrets.ZOHO_DC }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs fabrica-job-runner.mjs

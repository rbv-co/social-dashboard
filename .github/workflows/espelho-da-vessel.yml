name: Espelho da Vessel (resgate manual da planilha)

# ⚠️ ESTE ROBÔ NÃO TEM MAIS HORÁRIO. Ele só roda quando alguém aperta o botão.
#
# Até 21/09/2026 ele regravava, de hora em hora, NOVE arquivos CSV na pasta
# "Base de clientes". Nesse dia as onze planilhas viraram UM arquivo .xlsx com
# onze abas, e quem passou a escrevê-lo é a edge `vessel-espelhar-lista` — que
# escreve AO VIVO (um gatilho no banco a dispara no segundo do cadastro, e o
# cron a chama de 3 em 3 minutos).
#
# ⚠️ POR QUE O HORÁRIO SAIU, E NÃO PODE VOLTAR SEM PENSAR: são DOIS programas
# capazes de escrever o MESMO arquivo. Com os dois no automático, o último a
# subir vence e a planilha fica pulando entre duas versões — cada um comparando
# o arquivo com a sua própria ideia do que deveria estar lá, e regravando. O
# dono veria a planilha "mudando sozinha" sem motivo aparente.
#
# ELE FICA AQUI PORQUE SERVE DE RESGATE: se a edge estiver quebrada e a planilha
# precisar sair agora, este botão gera o MESMO arquivo, pelo MESMO código
# (`supabase/functions/_shared/abas-da-vessel.js`). Rodar uma vez à mão não
# atropela nada — a edge compara o arquivo e, se estiver igual, não faz nada.
#
# O modo ENSAIO monta a planilha e imprime as primeiras linhas de cada aba sem
# enviar nada. É o jeito de conferir uma coluna nova sem tocar no Zoho.
on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'Só montar e mostrar, sem enviar? (qualquer texto = sim)'
        required: false
        default: ''

concurrency:
  group: espelho-da-vessel
  cancel-in-progress: false

jobs:
  espelhar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Regravar a planilha
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENSAIO: ${{ github.event.inputs.ensaio }}
        run: |
          if [ -n "$ENSAIO" ]; then
            node coletor/espelhar-vessel-no-zoho.mjs --ensaio --mostrar
          else
            node coletor/espelhar-vessel-no-zoho.mjs
          fi

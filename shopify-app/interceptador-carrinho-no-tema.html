<!--
  INTERCEPTADOR DE CARRINHO — colado direto no tema (layout/theme.liquid),
  não é Web Pixel/Customer Events. Decisão do dono, 18/09/2026: o Custom
  Pixel só dispara pra quem aceita cookie de Marketing+Análises — a
  Shopify exige isso oficialmente pra esse tipo de rastreamento. Rodar
  dentro do próprio tema não passa por esse gate (decisão de privacidade
  assumida pela Vessel, não uma escolha técnica) e funciona igual em
  qualquer tema/app de carrinho, porque todos no fim chamam os mesmos
  endpoints da Ajax Cart API da Shopify (/cart/add.js, /cart/change.js,
  /cart/update.js) — confirmado na doc oficial:
  https://shopify.dev/docs/api/ajax/reference/cart.

  ONDE COLAR: dentro de <head>, o quanto antes possível — precisa rodar
  ANTES de qualquer script do tema que chame o carrinho. No tema atual
  (VESSEL BRASIL V1.0 ERICK), logo depois de <head>, antes de qualquer
  outro <script>.

  ATENÇÃO — ATUALIZAÇÃO DE TEMA: isto fica DENTRO do código do tema. Se um
  dia o tema for trocado ou "resetado" a partir de um tema novo, este
  bloco some junto, silenciosamente — colar de novo.

  TESTADO AO VIVO na loja de produção em 18/09/2026 (produto, preço,
  quantidade e cart_token corretos chegando em carrinho_eventos, incluindo
  o cenário de adicionar o mesmo produto duas vezes e depois remover
  tudo). Achados reais que moldaram este código, registrados pra ninguém
  repetir:
  - A resposta de /cart/add.js pra UM item só NÃO tem campo `token` (só a
    resposta cheia do carrinho tem) — o primeiro código chegou a rejeitar
    TODO evento de "adicionado" em silêncio por causa disso. Corrigido lendo
    o cookie `cart` do navegador, que a Shopify sempre grava, em qualquer
    chamada.
  - Quando o mesmo produto é adicionado de novo (já estava no carrinho), a
    Shopify devolve a quantidade TOTAL da linha, não o incremento — sem
    corrigir isso, "adicionei 1" registrava o total acumulado (ex.: 3→5 em
    vez de 2). Corrigido comparando com a última quantidade conhecida da
    linha (cache de página).
  - A resposta de /cart/change.js e /cart/update.js traz um campo
    `items_removed`, com o produto INTEIRO de quem saiu (id, título,
    variante, quantidade, preço) — não documentado nas páginas indexadas,
    mas confirmado numa resposta real da loja. Muito mais confiável que
    tentar adivinhar pela nossa própria memória de página (que se perde a
    cada recarregamento) — por isso o cache só é usado hoje pro cálculo do
    incremento de "adicionado", não mais pra achar o que foi removido.
  - ⚠️ Dentro de `items_removed`, o preço vem em REAIS como STRING
    ("1250.00") — diferente de `items[].price`, que vem em CENTAVOS como
    número. Duas unidades diferentes na mesma API, mesma resposta.
  - Esta loja tem um app de carrinho de terceiro (nomes "cartbot-*" nas
    chamadas de rede) — coberto interceptando tanto fetch quanto
    XMLHttpRequest, pra não depender de qual biblioteca o app usa por baixo.
  - `product_title` (não `title`, que combina "Produto - Variante") é o
    nome limpo do produto.

  ATUALIZADO 18/09/2026 — identidade de sessão ponta a ponta: todo evento
  agora leva `session_id` (cookie `_shopify_s`, da própria Shopify — grava
  sozinho em QUALQUER visita, antes de qualquer ação de carrinho) e, quando
  existirem, `_fbp`/`_fbc` (atribuição do Meta). Evento novo `sessao_iniciada`
  dispara uma vez por sessão, na entrada do site. NÃO existe evento de
  "sessão encerrada": `pagehide` dispara em toda troca de página, não só ao
  sair do site — gravar isso como evento inundaria a tabela de "encerradas"
  falsas. O fim da sessão é inferido por inatividade, igual carrinho
  abandonado.
-->
<script>
(function () {
  var URL_DA_EDGE = 'https://kounqtdoioootxqegkij.supabase.co/functions/v1/capturar-evento-carrinho';

  // A resposta de /cart/add.js pra UM item só NÃO tem campo `token` (só a
  // resposta cheia do carrinho tem). A Shopify grava esse mesmo valor
  // sempre no cookie `cart`, em QUALQUER chamada — fonte mais confiável,
  // não depende do formato de cada endpoint.
  function pegarCartTokenDoCookie() {
    var m = document.cookie.match(/(?:^|; )cart=([^;]*)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  // _fbp existe pra QUALQUER visitante com o Pixel do Meta rodando na loja
  // (não só quem clicou em anúncio); _fbc só existe em quem chegou por um
  // link com fbclid. Quem não veio do Meta segue sem os dois — o
  // identificador de sessão continua sendo o cart_token, de qualquer jeito.
  function pegarCookie(nome) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + nome + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  // fbclid vem na PRÓPRIA URL de quem clicou num anúncio do Meta — não é
  // cookie, nenhum navegador filtra isso (senão link nenhum funcionaria).
  // Serve de reforço quando o Pixel do Meta nem chega a rodar (bloqueado
  // por navegador/extensão de privacidade — Brave bloqueia o script dele
  // por padrão) e por isso _fbc nunca nasce como cookie. Formato imitando
  // o do próprio _fbc (recomendado pelo Meta pra quem constrói esse valor
  // na mão): fb.1.<timestamp>.<fbclid>. Guardado em localStorage porque o
  // fbclid só aparece na URL da página de entrada — sem persistir, some na
  // primeira navegação interna, antes de qualquer ação de carrinho.
  var CHAVE_FBC_RESERVA = 'rbv_fbc_reserva';
  (function () {
    var fbclid = new URLSearchParams(window.location.search).get('fbclid');
    if (fbclid) {
      try { localStorage.setItem(CHAVE_FBC_RESERVA, 'fb.1.' + Date.now() + '.' + fbclid); } catch (e) {}
    }
  })();

  function pegarFbc() {
    // O cookie de verdade do Pixel do Meta, quando existe, é a fonte
    // preferida (mais completa); a reserva de localStorage é só pra quem
    // bloqueou o Pixel mas ainda assim veio de um clique de anúncio.
    var doCookie = pegarCookie('_fbc');
    if (doCookie) return doCookie;
    try { return localStorage.getItem(CHAVE_FBC_RESERVA); } catch (e) { return null; }
  }

  function enviar(tipo, dados) {
    try {
      var base = {
        tipo: tipo,
        cart_token: pegarCartTokenDoCookie(),
        // _shopify_s é o ID de sessão da própria Shopify — grava sozinho em
        // QUALQUER visita, mesmo antes de qualquer ação de carrinho
        // (confirmado ao vivo, 18/09/2026: presente numa visita nova, sem
        // cookie nenhum antes). É ele que liga entrada, carrinho e
        // checkout na mesma sessão.
        session_id: pegarCookie('_shopify_s'),
        fbp: pegarCookie('_fbp'),
        fbc: pegarFbc(),
      };
      fetch(URL_DA_EDGE, {
        method: 'POST',
        body: JSON.stringify(Object.assign(base, dados)),
      }).catch(function () {
        // Falha de rede nunca pode aparecer pro cliente — é telemetria, não
        // é o fluxo de compra. Silenciada de propósito.
      });
    } catch (e) {}
  }

  // A Ajax Cart API devolve preço em CENTAVOS em items[].price — nossa
  // coluna `preco` é decimal, por isso a divisão. Usado só pra ADD; a
  // remoção usa items_removed, que tem outra unidade (ver mais abaixo).
  function linhaParaDados(item) {
    return {
      produto_id: item.product_id != null ? String(item.product_id) : null,
      produto_titulo: item.product_title || item.title || null,
      variante_id: item.variant_id != null ? String(item.variant_id) : null,
      quantidade: item.quantity,
      preco: item.price != null ? item.price / 100 : null,
    };
  }

  var CHAVE_CACHE_CARRINHO = 'rbv_carrinho_conhecido';

  function lerCacheDoCarrinho() {
    try {
      var bruto = localStorage.getItem(CHAVE_CACHE_CARRINHO);
      var dado = bruto ? JSON.parse(bruto) : null;
      return dado && typeof dado === 'object' ? dado : null;
    } catch (e) {
      return null;
    }
  }

  function persistirCache() {
    try {
      localStorage.setItem(CHAVE_CACHE_CARRINHO, JSON.stringify({
        cart_token: pegarCartTokenDoCookie(),
        porChave: carrinhoConhecidoPorChave,
        porVariante: carrinhoConhecidoPorVariante,
      }));
    } catch (e) {
      // localStorage cheio ou bloqueado (algumas abas anônimas recusam
      // escrita) — sem persistir, a quantidade volta a ser aproximação
      // depois de um reload, mas isso nunca pode quebrar o fluxo de compra.
    }
  }

  // Cache da última quantidade conhecida de cada linha, usado só pra saber
  // o INCREMENTO real de um "adicionar" repetido (a Shopify devolve o
  // total da linha, não o incremento). Chave = `key` da linha (estável
  // dentro da sessão) e, como reforço, o variant_id.
  //
  // ⚠️ PERSISTIDO em localStorage, não só memória de página — achado ao
  // vivo em produção, 18/09/2026: um reload no meio de duas adições fazia
  // a segunda registrar o TOTAL da Shopify como se fosse o incremento
  // (ex.: carrinho tinha 2, reload, "adicionar mais 1" virava "Adicionado
  // 3" em vez de "Adicionado 1"), inflando o que de fato foi adicionado.
  // PRESO ao cart_token atual: se o carrinho mudou (checkout concluído,
  // carrinho expirou), o cache velho é descartado de propósito — senão uma
  // linha igual (mesmo produto+variante, mesma `key`) de um carrinho
  // ANTERIOR contaminaria o cálculo do carrinho novo.
  var cacheSalvo = lerCacheDoCarrinho();
  var cacheEhDoCarrinhoAtual = cacheSalvo && cacheSalvo.cart_token === pegarCartTokenDoCookie();
  var carrinhoConhecidoPorChave = (cacheEhDoCarrinhoAtual && cacheSalvo.porChave) || {};
  var carrinhoConhecidoPorVariante = (cacheEhDoCarrinhoAtual && cacheSalvo.porVariante) || {};

  function atualizarCache(dadoDoCarrinho) {
    var novo = {};
    var novoPorVariante = {};
    (dadoDoCarrinho.items || []).forEach(function (item) {
      novo[item.key] = item.quantity;
      if (!(item.variant_id in novoPorVariante)) novoPorVariante[item.variant_id] = item.quantity;
    });
    carrinhoConhecidoPorChave = novo;
    carrinhoConhecidoPorVariante = novoPorVariante;
    persistirCache();
  }

  // Igual a atualizarCache, mas SOMA linhas em vez de trocar tudo — usada
  // depois de /cart/add.js, cuja resposta só traz as linhas afetadas (não
  // o carrinho inteiro); usar atualizarCache aqui apagaria a memória das
  // outras linhas.
  function atualizarCacheParcial(itens) {
    itens.forEach(function (item) {
      carrinhoConhecidoPorChave[item.key] = item.quantity;
      carrinhoConhecidoPorVariante[item.variant_id] = item.quantity;
    });
    persistirCache();
  }

  function achaQuantidadeConhecida(idDoPedido) {
    if (idDoPedido == null) return null;
    if (idDoPedido in carrinhoConhecidoPorChave) return carrinhoConhecidoPorChave[idDoPedido];
    if (idDoPedido in carrinhoConhecidoPorVariante) return carrinhoConhecidoPorVariante[idDoPedido];
    return null;
  }

  // Processa a resposta de UMA chamada de carrinho, não importa se ela
  // saiu via fetch ou via XMLHttpRequest — as duas formas terminam aqui.
  // `url` é o endereço do pedido; `respostaJson` é o corpo JÁ PARSEADO da
  // resposta (o objeto carrinho, ou o item, da Ajax Cart API).
  function processarChamadaDeCarrinho(url, respostaJson) {
    var ehAdd = /\/cart\/add(\.js)?(\?|$)/.test(url);
    var ehChange = /\/cart\/change(\.js)?(\?|$)/.test(url);
    var ehUpdate = /\/cart\/update(\.js)?(\?|$)/.test(url);
    if (!ehAdd && !ehChange && !ehUpdate) return;

    if (ehAdd) {
      var itens = respostaJson.items ? respostaJson.items : [respostaJson];
      itens.forEach(function (item) {
        // Guarda contra item sem identificador nenhum (visto ao vivo uma
        // vez, causa não confirmada) — melhor não mandar nada do que
        // gravar uma linha totalmente vazia e inútil.
        if (item.product_id == null && item.variant_id == null) return;
        // A Shopify devolve a quantidade TOTAL da linha (doc oficial: "se
        // o item já estava no carrinho, quantity é a NOVA quantidade
        // total"), não quanto foi adicionado nesta chamada. Corrigido pra
        // gravar o incremento de verdade, comparando com a última
        // quantidade conhecida desta linha — persistida em localStorage,
        // sobrevive a reload (ver cache acima).
        var quantidadeAntiga = achaQuantidadeConhecida(item.key);
        if (quantidadeAntiga == null) quantidadeAntiga = achaQuantidadeConhecida(item.variant_id);
        if (quantidadeAntiga == null) quantidadeAntiga = 0;
        var incremento = item.quantity - quantidadeAntiga;
        var dados = linhaParaDados(item);
        dados.quantidade = incremento > 0 ? incremento : item.quantity;
        enviar('produto_adicionado', dados);
      });
      atualizarCacheParcial(itens);
      return;
    }

    // ⚠️ AUMENTO via /cart/change.js e /cart/update.js — achado ao vivo,
    // 18/09/2026: o "+"/"-" do carrinho (drawer/página do carrinho) chama
    // esses dois endpoints, não /cart/add.js. Só tratávamos diminuição
    // aqui (por items_removed); clicar "+" no carrinho ficava INVISÍVEL,
    // nunca virava produto_adicionado. Corrigido comparando cada linha do
    // carrinho novo com a última quantidade conhecida — mesmo cache
    // persistido do "adicionar". Se a linha for desconhecida (nunca vista
    // por um /cart/add.js), não inventa um "adicionado" do tamanho todo —
    // fica em silêncio, é mais seguro que supor.
    (respostaJson.items || []).forEach(function (item) {
      if (item.product_id == null && item.variant_id == null) return;
      var quantidadeAntiga = achaQuantidadeConhecida(item.key);
      if (quantidadeAntiga == null) quantidadeAntiga = achaQuantidadeConhecida(item.variant_id);
      if (quantidadeAntiga == null || item.quantity <= quantidadeAntiga) return;
      var dadosAdd = linhaParaDados(item);
      dadosAdd.quantidade = item.quantity - quantidadeAntiga;
      enviar('produto_adicionado', dadosAdd);
    });

    // A própria Shopify já diz exatamente o que saiu em `items_removed` —
    // com produto, preço e quantidade prontos, e reporta o DELTA certo
    // mesmo em diminuição parcial (testado ao vivo: 3→1 reporta quantity:2,
    // não o total antigo). Descoberto testando ao vivo (18/09/2026): não é
    // documentado nas páginas indexadas, mas confirmado numa resposta real
    // da loja. Muito mais confiável que adivinhar pela nossa própria
    // memória de página.
    (respostaJson.items_removed || []).forEach(function (item) {
      if (item.product_id == null && item.variant_id == null) return;
      enviar('produto_removido', {
        produto_id: item.product_id != null ? String(item.product_id) : null,
        produto_titulo: item.product_title || item.title || null,
        variante_id: item.variant_id != null ? String(item.variant_id) : null,
        quantidade: item.quantity,
        // Aqui o preço já vem em REAIS, como string ("1250.00") — ao
        // contrário de items[].price, que vem em CENTAVOS. Conferido numa
        // resposta real; são dois campos com unidades diferentes na mesma
        // API.
        preco: item.price != null ? parseFloat(item.price) : null,
      });
    });

    if (ehChange || ehUpdate) atualizarCache(respostaJson);
  }

  var fetchOriginal = window.fetch;
  window.fetch = function (entrada, opcoes) {
    var url = typeof entrada === 'string' ? entrada : (entrada && entrada.url) || '';
    var metodo = ((opcoes && opcoes.method) || (entrada && entrada.method) || 'GET').toUpperCase();
    var promessa = fetchOriginal.apply(this, arguments);

    if (metodo === 'POST' && /\/cart\/(add|change|update)(\.js)?(\?|$)/.test(url)) {
      promessa.then(function (resposta) {
        resposta.clone().json().then(function (json) {
          processarChamadaDeCarrinho(url, json);
        }).catch(function () {});
      }).catch(function () {});
    }

    return promessa;
  };

  // Alguns apps de carrinho de terceiro (ex.: os que usam jQuery/XHR por
  // baixo, em vez de fetch) não passam pelo bloco acima — cobrindo
  // XMLHttpRequest também, pra não depender de qual biblioteca a loja usa.
  // Achado direto: esta loja tem um app de carrinho de terceiro (nomes
  // "cartbot-*" aparecendo nas chamadas de rede).
  var xhrOpenOriginal = XMLHttpRequest.prototype.open;
  var xhrSendOriginal = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (metodo, url) {
    this._rbvMetodo = metodo;
    this._rbvUrl = url;
    return xhrOpenOriginal.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function (corpo) {
    var xhr = this;
    var metodo = (xhr._rbvMetodo || 'GET').toUpperCase();
    var url = xhr._rbvUrl || '';
    if (metodo === 'POST' && /\/cart\/(add|change|update)(\.js)?(\?|$)/.test(url)) {
      xhr.addEventListener('load', function () {
        try {
          processarChamadaDeCarrinho(url, JSON.parse(xhr.responseText));
        } catch (e) {}
      });
    }
    return xhrSendOriginal.apply(this, arguments);
  };

  // checkout_iniciado NÃO dispara daqui — removido em 18/09/2026: o
  // checkout da Shopify roda numa aplicação separada do tema, este script
  // nunca chega a carregar lá (confirmado ao vivo: HTML da página de
  // checkout não inclui este arquivo). Quem grava esse evento agora é o
  // Webhook nativo checkouts/create — ver
  // supabase/functions/receber-webhook-checkout.

  // sessao_iniciada: dispara uma vez por sessão, na primeira página
  // carregada — marca a entrada, ANTES de existir carrinho. Não existe
  // evento de "sessão encerrada": pagehide dispara em qualquer troca de
  // página (não só ao sair do site de verdade), então gravar isso como
  // evento inundaria a tabela de "encerradas" falsas. O fim da sessão
  // continua sendo inferido por inatividade, do mesmo jeito que
  // carrinho_abandonados já faz.
  //
  // ⚠️ Usa localStorage, NÃO sessionStorage — achado ao vivo em produção,
  // 18/09/2026: sessionStorage é isolado POR ABA, mas o cookie _shopify_s
  // (a sessão de verdade) é do navegador inteiro. Com sessionStorage,
  // abrir uma segunda aba da loja (ou qualquer pré-carregamento que crie
  // um contexto novo) mandava sessao_iniciada de novo pra MESMA sessão —
  // visto no banco: mesmo session_id, mesmo IP, gravado várias vezes em
  // minutos, alguns a menos de 1 segundo de distância. Comparar com a
  // sessão ATUAL (não só "já mandei alguma vez") resolve os dois lados:
  // não duplica em aba nova da mesma sessão, e ainda manda de novo quando
  // uma sessão de verdade nova começa (_shopify_s muda, ~30min de troca).
  var sessaoAtual = pegarCookie('_shopify_s');
  var chaveUltimaSessao = 'rbv_ultima_sessao_iniciada';
  if (sessaoAtual && localStorage.getItem(chaveUltimaSessao) !== sessaoAtual) {
    localStorage.setItem(chaveUltimaSessao, sessaoAtual);
    enviar('sessao_iniciada', {});
  }
})();
</script>

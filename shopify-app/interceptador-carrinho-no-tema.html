<!--
  INTERCEPTADOR DE CARRINHO — colado direto no tema (layout/theme.liquid),
  não é Web Pixel/Customer Events. Decisão do dono, 18/09/2026: o Custom
  Pixel só dispara pra quem aceita cookie de Marketing+Análises — a
  Shopify exige isso oficialmente pra esse tipo de rastreamento. Rodar
  dentro do próprio tema não passa por esse gate (decisão de privacidade
  assumida pela Vessel, não uma escolha técnica) e funciona igual em
  qualquer tema/app de carrinho, porque todos no fim chamam os mesmos
  endpoints da Ajax Cart API da Shopify (/cart/add.js, /cart/change.js,
  /cart/update.js) — confirmado na doc oficial:
  https://shopify.dev/docs/api/ajax/reference/cart.

  ONDE COLAR: dentro de <head>, o quanto antes possível — precisa rodar
  ANTES de qualquer script do tema que chame o carrinho. No tema atual
  (VESSEL BRASIL V1.0 ERICK), logo depois de <head>, antes de qualquer
  outro <script>.

  ATENÇÃO — ATUALIZAÇÃO DE TEMA: isto fica DENTRO do código do tema. Se um
  dia o tema for trocado ou "resetado" a partir de um tema novo, este
  bloco some junto, silenciosamente — colar de novo.

  TESTADO AO VIVO na loja de produção em 18/09/2026 (produto, preço,
  quantidade e cart_token corretos chegando em carrinho_eventos). Achados
  reais que moldaram este código, registrados pra ninguém repetir:
  - A resposta de /cart/add.js pra UM item só NÃO tem campo `token` (só a
    resposta cheia do carrinho tem) — o primeiro código chegou a rejeitar
    TODO evento de "adicionado" em silêncio por causa disso. Corrigido lendo
    o cookie `cart` do navegador, que a Shopify sempre grava, em qualquer
    chamada.
  - Esta loja tem um app de carrinho de terceiro (nomes "cartbot-*" nas
    chamadas de rede) — coberto interceptando tanto fetch quanto
    XMLHttpRequest, pra não depender de qual biblioteca o app usa por baixo.
  - `product_title` (não `title`, que combina "Produto - Variante") é o
    nome limpo do produto, confirmado numa resposta real da loja.
  - A Ajax Cart API devolve preço em CENTAVOS — daí a divisão por 100.
-->
<script>
(function () {
  var URL_DA_EDGE = 'https://kounqtdoioootxqegkij.supabase.co/functions/v1/capturar-evento-carrinho';

  // A resposta de /cart/add.js pra UM item só NÃO tem campo `token` (só a
  // resposta cheia do carrinho tem). A Shopify grava esse mesmo valor
  // sempre no cookie `cart`, em QUALQUER chamada — fonte mais confiável,
  // não depende do formato de cada endpoint.
  function pegarCartTokenDoCookie() {
    var m = document.cookie.match(/(?:^|; )cart=([^;]*)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function enviar(tipo, dados) {
    try {
      fetch(URL_DA_EDGE, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ tipo: tipo, cart_token: pegarCartTokenDoCookie() }, dados)),
      }).catch(function () {
        // Falha de rede nunca pode aparecer pro cliente — é telemetria, não
        // é o fluxo de compra. Silenciada de propósito.
      });
    } catch (e) {}
  }

  // A Ajax Cart API devolve preço em CENTAVOS — nossa coluna `preco` é
  // decimal, por isso a divisão.
  function linhaParaDados(item) {
    return {
      produto_id: item.product_id != null ? String(item.product_id) : null,
      produto_titulo: item.product_title || item.title || null,
      variante_id: item.variant_id != null ? String(item.variant_id) : null,
      quantidade: item.quantity,
      preco: item.price != null ? item.price / 100 : null,
    };
  }

  // Cache da última foto conhecida do carrinho, pra saber QUAL produto
  // saiu quando o pedido de mudança só manda "linha X, quantidade 0" (a
  // resposta depois da mudança não tem mais a linha nenhuma). Chave =
  // `key` da linha (estável dentro da sessão) e, como reforço, o
  // variant_id (menos preciso: duas linhas podem repetir variant_id com
  // propriedades diferentes — pega a primeira nesse caso).
  var carrinhoConhecidoPorChave = {};
  var carrinhoConhecidoPorVariante = {};
  function atualizarCache(dadoDoCarrinho) {
    var novo = {};
    var novoPorVariante = {};
    (dadoDoCarrinho.items || []).forEach(function (item) {
      novo[item.key] = item;
      if (!(item.variant_id in novoPorVariante)) novoPorVariante[item.variant_id] = item;
    });
    carrinhoConhecidoPorChave = novo;
    carrinhoConhecidoPorVariante = novoPorVariante;
  }

  function achaLinhaConhecida(idDoPedido) {
    if (idDoPedido == null) return null;
    return carrinhoConhecidoPorChave[idDoPedido] || carrinhoConhecidoPorVariante[idDoPedido] || null;
  }

  // Processa a resposta de UMA chamada de carrinho, não importa se ela
  // saiu via fetch ou via XMLHttpRequest — as duas formas terminam aqui.
  // `url`/`corpoBruto` são os dados do PEDIDO; `respostaJson` é o corpo
  // JÁ PARSEADO da resposta (o objeto carrinho, ou o item, da Ajax Cart
  // API).
  function processarChamadaDeCarrinho(url, corpoBruto, respostaJson) {
    var ehAdd = /\/cart\/add(\.js)?(\?|$)/.test(url);
    var ehChange = /\/cart\/change(\.js)?(\?|$)/.test(url);
    var ehUpdate = /\/cart\/update(\.js)?(\?|$)/.test(url);
    if (!ehAdd && !ehChange && !ehUpdate) return;

    var corpoDoPedido = null;
    try {
      if (typeof corpoBruto === 'string') corpoDoPedido = JSON.parse(corpoBruto);
    } catch (e) {
      // ponytail: corpo enviado como FormData (não string JSON) não é
      // lido aqui — a maioria dos apps modernos manda JSON.
    }

    if (ehAdd) {
      var itens = respostaJson.items ? respostaJson.items : [respostaJson];
      itens.forEach(function (item) {
        enviar('produto_adicionado', linhaParaDados(item));
      });
      return;
    }

    if (ehChange && corpoDoPedido && Number(corpoDoPedido.quantity) === 0) {
      var linhaAntiga = achaLinhaConhecida(corpoDoPedido.id);
      var dadosDaLinha = linhaAntiga ? linhaParaDados(linhaAntiga) : {};
      enviar('produto_removido', dadosDaLinha);
      atualizarCache(respostaJson);
      return;
    }

    if (ehUpdate && corpoDoPedido && corpoDoPedido.updates) {
      var chavesZeradas = Object.keys(corpoDoPedido.updates).filter(function (chave) {
        return Number(corpoDoPedido.updates[chave]) === 0;
      });
      if (chavesZeradas.length) {
        chavesZeradas.forEach(function (chave) {
          var linhaAntigaU = achaLinhaConhecida(chave);
          var dadosDaLinhaU = linhaAntigaU ? linhaParaDados(linhaAntigaU) : {};
          enviar('produto_removido', dadosDaLinhaU);
        });
        atualizarCache(respostaJson);
        return;
      }
    }

    // Mudança de quantidade que NÃO é remoção: sem evento (fora do MVP),
    // mas atualiza o cache pra próxima remoção continuar sabendo o que tinha.
    if (ehChange || ehUpdate) atualizarCache(respostaJson);
  }

  var fetchOriginal = window.fetch;
  window.fetch = function (entrada, opcoes) {
    var url = typeof entrada === 'string' ? entrada : (entrada && entrada.url) || '';
    var metodo = ((opcoes && opcoes.method) || (entrada && entrada.method) || 'GET').toUpperCase();
    var promessa = fetchOriginal.apply(this, arguments);

    if (metodo === 'POST' && /\/cart\/(add|change|update)(\.js)?(\?|$)/.test(url)) {
      var corpoBruto = opcoes && opcoes.body;
      promessa.then(function (resposta) {
        resposta.clone().json().then(function (json) {
          processarChamadaDeCarrinho(url, corpoBruto, json);
        }).catch(function () {});
      }).catch(function () {});
    }

    return promessa;
  };

  // Alguns apps de carrinho de terceiro (ex.: os que usam jQuery/XHR por
  // baixo, em vez de fetch) não passam pelo bloco acima — cobrindo
  // XMLHttpRequest também, pra não depender de qual biblioteca a loja usa.
  // Achado direto: esta loja tem um app de carrinho de terceiro (nomes
  // "cartbot-*" aparecendo nas chamadas de rede).
  var xhrOpenOriginal = XMLHttpRequest.prototype.open;
  var xhrSendOriginal = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (metodo, url) {
    this._rbvMetodo = metodo;
    this._rbvUrl = url;
    return xhrOpenOriginal.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function (corpo) {
    var xhr = this;
    var metodo = (xhr._rbvMetodo || 'GET').toUpperCase();
    var url = xhr._rbvUrl || '';
    if (metodo === 'POST' && /\/cart\/(add|change|update)(\.js)?(\?|$)/.test(url)) {
      xhr.addEventListener('load', function () {
        try {
          processarChamadaDeCarrinho(url, corpo, JSON.parse(xhr.responseText));
        } catch (e) {}
      });
    }
    return xhrSendOriginal.apply(this, arguments);
  };

  // checkout iniciado: não é uma chamada de carrinho, é navegação de
  // página — dispara uma vez por sessão de navegador ao chegar em /checkout.
  if (window.location.pathname.indexOf('/checkout') === 0) {
    var jaMandouChave = 'rbv_checkout_iniciado_enviado';
    if (!sessionStorage.getItem(jaMandouChave)) {
      sessionStorage.setItem(jaMandouChave, '1');
      enviar('checkout_iniciado', {});
    }
  }
})();
</script>

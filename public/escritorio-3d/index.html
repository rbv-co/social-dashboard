<!-- PORTEIRO. Esta página é ESTÁTICA e carrega a chave anônima — antes de
     04/08/2026 qualquer pessoa com o endereço abria, logada ou não. Esconder o
     cartão na home não protegia nada: o endereço é fixo e adivinhável.

     A checagem roda ANTES de qualquer outra coisa e usa `fetch` puro, sem
     esperar o supabase-js do CDN: dependência de ordem de script num porteiro é
     como deixar a porta encostada enquanto a fechadura carrega.

     Lê os DOIS campos de permissão de propósito. O sistema tem dois modelos
     (`permissions` no front, `features[]` no Edge/RLS) e eles nem sempre
     concordam — checar só um deixaria gente legítima de fora ou gente de fora

<script>
(function(){
  var U='https://kounqtdoioootxqegkij.supabase.co';
  var AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvdW5xdGRvaW9vb3R4cWVna2lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDMwMDUsImV4cCI6MjA5NDc3OTAwNX0.MVXa6jngjKXkH3eZ7as_j_k8Eb7lJKcFmO4kCKAnuHM';
  var el=document.getElementById('porteiro');
  function nega(msg){
    el.innerHTML='<div><div style="font-size:16px;color:#e8ecf8;margin-bottom:8px;">'+msg+'</div>'+
      '<a href="/" style="color:#6ea8ff;">voltar para a Central</a></div>';
  }
  var chave=null;
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(/^sb-.*-auth-token$/.test(k)){chave=k;break;} } }catch(e){}
  var tok=null;
  if(chave){ try{ tok=JSON.parse(localStorage.getItem(chave)); }catch(e){} }
  if(!tok||!tok.access_token){ nega('Entre na Central para ver o Escritório 3D.'); return; }
  var uid=(tok.user&&tok.user.id)||'';
  if(!uid){ nega('Não consegui identificar sua sessão. Entre de novo.'); return; }
  // BUSCA O PERFIL, E SABE RENOVAR A SESSÃO ANTES DE DESISTIR.
  //
  // Visto ao vivo em 04/08/2026: o porteiro barrou um SUPERADMIN dizendo "não
  // consegui ler seu perfil", e a MESMA chamada dava 200 segundos depois. O
  // motivo é que esta página é ESTÁTICA — ela não tem o supabase-js cuidando da
  // sessão como o aplicativo tem. Com o `access_token` guardado já vencido (ou
  // recém-trocado), a leitura volta 401.
  //
  // Negar por dúvida é o padrão certo para PERMISSÃO. Só que isto não era
  // dúvida de permissão: era sessão velha — e tratar as duas como a mesma coisa
  // tranca do lado de fora justamente quem tem a chave.
  function perfil(token){
    return fetch(U+'/rest/v1/profiles?select=role,is_superadmin,permissions,features&id=eq.'+encodeURIComponent(uid),
      {headers:{apikey:AK,Authorization:'Bearer '+token}})
      .then(function(r){ return r.status===401 ? null : r.json(); });
  }
  function renovar(){
    if(!tok.refresh_token) return Promise.resolve(null);
    return fetch(U+'/auth/v1/token?grant_type=refresh_token',
      {method:'POST',headers:{apikey:AK,'Content-Type':'application/json'},
       body:JSON.stringify({refresh_token:tok.refresh_token})})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return (j&&j.access_token)||null; });
  }
  perfil(tok.access_token)
    .then(function(d){
      // UMA tentativa de renovar, e só quando a primeira falhou por sessão.
      // Repetir em laço transformaria problema de login em martelada no
      // servidor de autenticação.
      if(d) return d;
      return renovar().then(function(novo){ return novo ? perfil(novo) : null; });
    })
    .then(function(d){
      var p=(d&&d[0])||null;

      // atalho. Com ele aqui, um admin comum não veria o cartão mas entraria
      // pelo endereço — porta que a tela diz estar fechada e não está. As duas
      // portas passam a responder a mesma coisa.
      var pode = p.is_superadmin===true
              || feats.indexOf('escritorio3d')>=0
              || ((perms['escritorio3d']||[]).indexOf('ver')>=0);
      if(!pode){ nega('Você ainda não tem acesso ao Escritório 3D.'); return; }
      el.parentNode.removeChild(el);
    })
    .catch(function(){ nega('Não consegui conferir seu acesso agora.'); });
})();

function pick(e){if(moved)return;pt.x=e.clientX/innerWidth*2-1;pt.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pt,camera);const hit=ray.intersectObjects(clickable,true);
 if(hit.length){let o=hit[0].object;while(o&&!o.userData.agent)o=o.parent;if(o){const a=o.userData.agent;document.getElementById('c-r2').textContent=a.role;document.getElementById('c-nm').textContent=a.name;document.getElementById('c-body').textContent=a.desc;document.getElementById('card').classList.add('show');}}else document.getElementById('card').classList.remove('show');}

/* ---- CÂMERA ---- */
const target=new THREE.Vector3(BW/2,1,BD/2);let az=-2.3,pol=0.92,rad=46;
function uc(){const sp=Math.sin(pol);camera.position.set(target.x+rad*sp*Math.sin(az),target.y+rad*Math.cos(pol),target.z+rad*sp*Math.cos(az));camera.lookAt(target);}
let drag=null;const cv=document.getElementById('c');
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,b:e.button,tx:target.x,tz:target.z,az,pol};moved=false;});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(drag.b===2||e.shiftKey){const s=rad*0.0016,sa=Math.sin(az),ca=Math.cos(az);target.x=drag.tx-(dx*ca-dy*sa)*s;target.z=drag.tz-(dx*sa+dy*ca)*s;}else{az=drag.az-dx*0.005;pol=Math.max(0.18,Math.min(1.45,drag.pol-dy*0.005));}uc();});
addEventListener('pointerup',e=>{if(drag&&!moved&&e.button===0)pick(e);drag=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.max(6,Math.min(90,rad*(e.deltaY>0?1.08:0.93)));uc();},{passive:false});
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function walk(){const s=0.25,sa=Math.sin(az),ca=Math.cos(az);let mx=0,mz=0;if(keys['w']){mx-=sa;mz-=ca;}if(keys['s']){mx+=sa;mz+=ca;}if(keys['a']){mx-=ca;mz+=sa;}if(keys['d']){mx+=ca;mz-=sa;}if(mx||mz){target.x+=mx*s;target.z+=mz*s;uc();}}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setSize(innerWidth,innerHeight);uc();document.getElementById('loading').style.display='none';
let _l=performance.now();(function loop(now){now=now||performance.now();const dt=Math.min(0.05,(now-_l)/1000);_l=now;walk();updW(dt);pulse(now);renderer.render(scene,camera);requestAnimationFrame(loop);})();
</script></body></html>
